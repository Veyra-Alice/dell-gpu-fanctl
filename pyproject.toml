[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dell-gpu-fanctl"
version = "0.1.0"
description = "GPU-aware Dell DAPC fan offset controller"
requires-python = ">=3.9"

[project.scripts]
dell-gpu-fanctl = "dell_gpu_fanctl.controller:main"

[tool.setuptools.packages.find]
where = ["src"]
